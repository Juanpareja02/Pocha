name: Staging backend (manual)

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy the image through the configured staging webhook"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    name: Validate backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: WebSocket E2E tests
        run: npm run test:e2e
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Prisma validation
        run: npm run prisma:validate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      - name: Build
        run: npm run build

  image:
    name: Build and publish backend image
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image-ref.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compute image reference
        id: image-ref
        shell: bash
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/pocha-server:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: ${{ steps.image-ref.outputs.image }}

  deploy:
    name: Deploy staging (explicit)
    if: ${{ inputs.deploy == true }}
    needs: image
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    steps:
      - name: Checkout for database migration
        uses: actions/checkout@v4
      - name: Setup Node.js for Prisma
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install migration dependencies
        working-directory: server
        run: npm ci
      - name: Apply committed Prisma migrations
        working-directory: server
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: npm run prisma:migrate:deploy
      - name: Generate Prisma client
        working-directory: server
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: npm run prisma:generate
      - name: Require the configured deployment webhook
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DEPLOY_WEBHOOK_URL: ${{ secrets.STAGING_DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo 'Missing STAGING_DATABASE_URL in the staging environment.'
            exit 1
          fi
          if [ -z "$DEPLOY_WEBHOOK_URL" ]; then
            echo 'Missing STAGING_DEPLOY_WEBHOOK_URL in the staging environment.'
            exit 1
          fi
      - name: Request deployment
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.STAGING_DEPLOY_WEBHOOK_URL }}
          DEPLOY_WEBHOOK_TOKEN: ${{ secrets.STAGING_DEPLOY_WEBHOOK_TOKEN }}
          IMAGE: ${{ needs.image.outputs.image }}
          GIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          payload=$(jq -cn \
            --arg image "$IMAGE" \
            --arg sha "$GIT_SHA" \
            '{image: $image, gitSha: $sha, environment: "staging"}')
          headers=(-H 'Content-Type: application/json')
          if [ -n "$DEPLOY_WEBHOOK_TOKEN" ]; then
            headers+=(-H "Authorization: Bearer $DEPLOY_WEBHOOK_TOKEN")
          fi
          curl --fail-with-body --silent --show-error \
            --request POST \
            "${headers[@]}" \
            --data "$payload" \
            "$DEPLOY_WEBHOOK_URL"
      - name: Verify staging readiness
        env:
          STAGING_HEALTHCHECK_URL: ${{ secrets.STAGING_HEALTHCHECK_URL }}
        shell: bash
        run: |
          case "$STAGING_HEALTHCHECK_URL" in
            https://*) ;;
            *)
              echo 'Missing or insecure STAGING_HEALTHCHECK_URL; expected an HTTPS /health/ready URL.'
              exit 1
              ;;
          esac
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error "$STAGING_HEALTHCHECK_URL"; then
              echo
              exit 0
            fi
            sleep 5
          done
          echo 'Staging readiness did not become healthy within 60 seconds.'
          exit 1
