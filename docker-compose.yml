services:
  postgres:
    image: postgres:16-alpine
    container_name: pocha-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pocha
      POSTGRES_PASSWORD: pocha
      POSTGRES_DB: pocha
    ports:
      - "5432:5432"
    volumes:
      - pocha-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pocha -d pocha"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pocha-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - pocha-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pocha-postgres-data:
  pocha-redis-data:
